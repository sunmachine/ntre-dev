name: clang-format

# Checks only the lines a pull request changed, and only in NEO-owned paths.
# Valve directories are covered by the root .clang-format (DisableFormat: true)
# and never report anything. The commands live in tools/format_changed.py, which
# contributors run locally, and the Windows job keeps that path working.

on:
  pull_request:
    paths:
      - 'src/game/client/neo/**'
      - 'src/game/server/neo/**'
      - 'src/game/shared/neo/**'
      - 'src/common/neo/**'
      - 'src/tests/**'
      - 'src/materialsystem/stdshaders/**'
      - 'src/launcher_main/neo_case_heal.h'
      - '**/.clang-format'
      - 'tools/format_changed.py'
      - '.github/workflows/clang-format.yml'

jobs:
  format:
    name: clang-format (changed lines, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The same pinned version as CONTRIBUTING.md, so a contributor's local run
      # and this job lay code out identically.
      - name: Install clang-format 19
        run: python -m pip install clang-format==19.1.7

      - name: Check changed lines
        run: python -I tools/format_changed.py --check --base "origin/${{ github.base_ref }}"
