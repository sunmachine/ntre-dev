<title>ntre-dev notes</title>

<style>
:root { color-scheme: light dark; --bg: #ffffff; --ink: #1a1d21; --muted: #59626d; --line: #d8dce1; --link: #1f5f8b; }
@media (prefers-color-scheme: dark) { :root { --bg: #15181c; --ink: #e2e5e9; --muted: #9aa3ad; --line: #2f353d; --link: #7fb2da; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; }
p { margin: 0; color: var(--muted); }
ul { list-style: none; margin: 28px 0 0; padding: 0; border-top: 1px solid var(--line); }
li { padding: 12px 0; border-bottom: 1px solid var(--line); }
a { color: var(--link); text-decoration: none; font-weight: 500; }
a:hover, a:focus-visible { text-decoration: underline; }
li span { display: block; color: var(--muted); font-size: 0.92rem; }
</style>
</head>

<main>

  </ul>
</main>
